<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой гараж — бортовые журналы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2433; --paper:#FFFDF4; --paper-2:#F4EEDB; --peg:#DCAA6E; --peg-hole:#A97B45;
  --floor:#C8CDD5; --floor-2:#BCC2CB; --yellow:#FFC93C; --red:#E84A3F; --green:#35B26B;
  --blue:#2F6FD6; --brown:#8A5426; --wood:#C27F42; --metal:#97A1AE; --asphalt:#3C4150;
  --sky:#9ED8F2; --sky-2:#CDEBF7; --chalk:#2F5D4E; --text:#1F2433; --muted:#5B6274; --bg:#ECE6D6;
  --shadow:4px 4px 0 var(--ink);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A2F3E; --paper-2:#343A4C; --peg:#6F4C2D; --peg-hole:#47301B; --floor:#464C5D; --floor-2:#3D4353;
    --sky:#1D2A4D; --sky-2:#2C3C66; --text:#F3EFE4; --muted:#B5BACA; --bg:#1B1F2B; --chalk:#21443A;
    --ink:#0E1118; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A2F3E; --paper-2:#343A4C; --peg:#6F4C2D; --peg-hole:#47301B; --floor:#464C5D; --floor-2:#3D4353;
  --sky:#1D2A4D; --sky-2:#2C3C66; --text:#F3EFE4; --muted:#B5BACA; --bg:#1B1F2B; --chalk:#21443A;
  --ink:#0E1118; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px); }
body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Rubik", system-ui, "Segoe UI", Arial, sans-serif; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--sky); }
h1,h2,h3{ font-family:"Russo One","Rubik",system-ui,sans-serif; font-weight:400; line-height:1.15; margin:0; }
a{ color:inherit; }
img{ max-width:100%; display:block; }
:focus-visible{ outline:3px solid var(--yellow); outline-offset:3px; box-shadow:0 0 0 6px var(--ink); border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Road navigation ---------- */
.roadbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:linear-gradient(var(--sky), var(--sky-2)); border-bottom:4px solid var(--ink); display:flex; align-items:stretch; }
.road-scroll{ flex:1; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }
.road{ position:relative; min-width:max-content; height:118px; padding:0 40px; display:flex; align-items:flex-end; }
.road::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:34px; background:
  repeating-linear-gradient(90deg, var(--yellow) 0 26px, transparent 26px 50px) center/100% 4px no-repeat, var(--asphalt);
  border-top:3px solid var(--ink); z-index:0; }
.stops{ display:flex; align-items:flex-end; gap:22px; position:relative; z-index:1; padding-bottom:34px; }
.stop{ display:flex; flex-direction:column; align-items:center; text-decoration:none; }
.stop .sign{ font-family:"Russo One",sans-serif; font-size:13px; line-height:1.2; color:#fff; background:var(--blue); border:3px solid var(--ink); border-radius:7px; padding:6px 10px; max-width:150px; text-align:center; box-shadow:3px 3px 0 var(--ink); position:relative; transition:transform .15s; box-sizing:border-box; outline:2px solid #fff; outline-offset:-6px; }
.stop .pole{ width:6px; height:20px; background:var(--metal); border:2px solid var(--ink); border-bottom:0; }
.stop-branch .sign{ background:var(--green); font-size:12px; }
.stop-branch .pole{ height:12px; }
.stop-service .sign{ background:var(--brown); }
.stop-main .sign{ background:var(--red); }
.stop:hover .sign{ transform:translateY(-3px); }
.stop.active .sign{ background:var(--yellow); color:var(--ink); outline-color:var(--ink); }
.badge{ position:absolute; top:-10px; right:-10px; min-width:22px; height:22px; padding:0 5px; border-radius:11px; background:var(--red); color:#fff; border:2px solid var(--ink); font:700 12px/18px "Rubik",sans-serif; }
.marker{ position:absolute; left:0; bottom:3px; width:64px; z-index:2; transition:transform .9s cubic-bezier(.45,.05,.3,1); pointer-events:none; }
.marker .mk{ transition:transform .2s; }
.marker.flip .mk{ transform:scaleX(-1); }
.marker.driving svg{ animation:bob .18s ease-in-out infinite alternate; }
@keyframes bob{ to{ transform:translateY(-2px); } }
.theme-btn{ flex:none; margin:10px 12px 40px 0; align-self:flex-start; }

/* ---------- Buttons & inputs ---------- */
.btn{ font:600 15px/1.2 "Rubik",sans-serif; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border:3px solid var(--ink); border-radius:10px; background:var(--yellow); color:#1F2433; box-shadow:3px 3px 0 var(--ink); cursor:pointer; text-decoration:none; transition:transform .08s, box-shadow .08s; }
.btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
.btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.btn.ghost{ background:var(--paper); color:var(--text); }
.btn.danger{ background:var(--red); color:#fff; }
.btn.small{ padding:5px 10px; font-size:13px; border-width:2px; box-shadow:2px 2px 0 var(--ink); }
.btn.icon{ padding:4px 9px; }
label.f{ display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:500; color:var(--muted); }
input,select,textarea{ font:15px/1.3 "Rubik",sans-serif; color:var(--text); background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:8px 10px; width:100%; min-width:0; }
textarea{ min-height:70px; resize:vertical; }
input[type=checkbox],input[type=radio]{ width:20px; height:20px; accent-color:var(--green); flex:none; }
input[type=color]{ padding:2px; height:40px; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.span2{ grid-column:span 2; }
@media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } .span2{ grid-column:auto; } }

/* ---------- Garage scene ---------- */
main{ max-width:1320px; margin:0 auto; padding:0 0 60px; }
.pegboard{ background-color:var(--peg); background-image:radial-gradient(circle, var(--peg-hole) 2.6px, transparent 3px); background-size:24px 24px; }
.scene{ border-bottom:4px solid var(--ink); }
.wall-top{ display:grid; grid-template-columns:1fr minmax(260px,380px); gap:28px; align-items:start; padding:34px 28px 26px; }
.garage-sign{ justify-self:start; display:inline-flex; align-items:center; gap:18px; font-size:clamp(34px,6vw,64px); color:#1F2433; background:linear-gradient(#E6EAF0,#B9C1CC); border:4px solid var(--ink); border-radius:14px; padding:14px 26px; box-shadow:6px 6px 0 var(--ink); transform:rotate(-1.5deg); letter-spacing:.01em; }
.rivet{ width:14px; height:14px; border-radius:50%; background:#7D8795; border:3px solid var(--ink); flex:none; }
.garage-lead{ margin:22px 0 0; max-width:52ch; background:var(--paper); border:3px solid var(--ink); border-radius:10px; padding:10px 14px; box-shadow:var(--shadow); }
.board{ display:block; text-decoration:none; background:var(--chalk); color:#F5F2E8; border:10px solid var(--wood); outline:3px solid var(--ink); border-radius:6px; padding:14px 16px; box-shadow:6px 6px 0 var(--ink); min-height:170px; }
.board h2{ font-size:22px; margin-bottom:8px; }
.board ul{ margin:0; padding:0; list-style:none; font-size:14px; }
.board li{ display:flex; gap:8px; align-items:baseline; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,.25); }
.dot{ width:10px; height:10px; border-radius:50%; flex:none; border:2px solid var(--ink); }
.dot.red{ background:var(--red); } .dot.yellow{ background:var(--yellow); } .dot.green{ background:var(--green); }
.demo-note{ margin:0 28px 22px; display:flex; flex-wrap:wrap; align-items:center; gap:12px; background:var(--paper); border:3px dashed var(--ink); border-radius:10px; padding:10px 14px; }

.bays{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.bay{ display:flex; flex-direction:column; min-width:0; }
.bay-wall{ position:relative; padding:0 18px 18px; height:330px; display:flex; flex-direction:column; align-items:center; }
.lamp{ display:flex; flex-direction:column; align-items:center; }
.lamp .cord{ width:3px; height:26px; background:var(--ink); }
.lamp .shade{ width:70px; height:26px; background:#4E5668; border:3px solid var(--ink); clip-path:polygon(25% 0,75% 0,100% 100%,0 100%); position:relative; }
.lamp .shade{ clip-path:none; border-radius:40px 40px 6px 6px; }
.lamp .bulb{ width:30px; height:18px; margin-top:-3px; border:3px solid var(--ink); border-top:0; border-radius:0 0 16px 16px; background:#ddd; }
.lamp-green .bulb{ background:var(--green); box-shadow:0 10px 26px 6px rgba(53,178,107,.55); }
.lamp-yellow .bulb{ background:var(--yellow); box-shadow:0 10px 26px 6px rgba(255,201,60,.6); }
.lamp-red .bulb{ background:var(--red); box-shadow:0 10px 26px 8px rgba(232,74,63,.6); animation:blink 1.2s steps(2,end) infinite; }
.lamp-unknown .bulb{ background:#C9CED6; }
@keyframes blink{ 50%{ background:#7d2620; box-shadow:none; } }
.lamp-text{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:100%; font-size:13px; margin:8px 0 0; background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:3px 9px; text-align:center; }
.polaroid{ margin-top:14px; display:block; width:190px; background:#fff; color:#1F2433; padding:9px 9px 6px; border:3px solid var(--ink); box-shadow:var(--shadow); transform:rotate(-2deg); text-decoration:none; position:relative; transition:transform .2s; }
.bay:nth-child(2n) .polaroid{ transform:rotate(2deg); }
.polaroid:hover{ transform:rotate(0) scale(1.03); }
.polaroid::before{ content:""; position:absolute; top:-11px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:var(--red); border:3px solid var(--ink); }
.polaroid .ph{ aspect-ratio:4/3; background:#E5E8EE; display:flex; align-items:center; justify-content:center; overflow:hidden; border:2px solid var(--ink); }
.polaroid .ph img{ width:100%; height:100%; object-fit:cover; }
.polaroid .ph span{ font-size:13px; color:#5B6274; text-align:center; padding:8px; }
.polaroid figcaption{ font-family:"Russo One",sans-serif; font-size:15px; text-align:center; padding-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bay-floor{ background:linear-gradient(var(--floor),var(--floor-2)); border-top:10px solid; border-image:repeating-linear-gradient(45deg,#1F2433 0 14px,var(--yellow) 14px 28px) 10; padding:16px 18px 22px; display:flex; flex-direction:column; align-items:center; gap:12px; flex:1; position:relative; }
.bay + .bay .bay-floor::before{ content:""; position:absolute; left:-4px; top:0; bottom:0; width:8px; background:var(--yellow); border:2px solid var(--ink); }
.bay-num{ position:absolute; left:20px; top:14px; font:44px/1 "Russo One",sans-serif; color:rgba(255,255,255,.75); -webkit-text-stroke:2px var(--ink); }
.car-link{ display:block; width:min(100%,250px); text-decoration:none; }
.sil{ width:100%; height:auto; overflow:visible; filter:drop-shadow(0 6px 0 rgba(0,0,0,.18)); }
.plate{ font:16px/1 "Russo One",sans-serif; background:#fff; color:#1F2433; border:3px solid var(--ink); border-radius:6px; padding:5px 12px; letter-spacing:.06em; }
.mini-rack{ width:100%; max-width:290px; border-left:8px solid var(--metal); border-right:8px solid var(--metal); outline:3px solid var(--ink); background:rgba(0,0,0,.08); display:grid; grid-template-columns:1fr 1fr; }
.mini-shelf{ display:flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none; padding:8px 4px 0; border-bottom:8px solid var(--wood); box-shadow:inset 0 -3px 0 var(--ink); font-size:12.5px; font-weight:500; text-align:center; line-height:1.2; padding-bottom:10px; transition:background .15s; }
.mini-shelf:hover{ background:rgba(255,255,255,.35); }
.mini-shelf svg{ width:46px; height:34px; transition:transform .2s; }
.mini-shelf:hover svg{ transform:translateY(-4px) rotate(-3deg); }
.mini-shelf b{ font-weight:700; }
.bay-add{ min-height:420px; margin:24px; border:4px dashed var(--ink); border-radius:16px; background:rgba(255,255,255,.35); font:20px/1.2 "Russo One",sans-serif; color:#1F2433; cursor:pointer; }
.bay-add:hover{ background:rgba(255,255,255,.6); }
@media (max-width:720px){
  .wall-top{ grid-template-columns:1fr; padding:22px 16px; }
  .bays{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; }
  .bay,.bay-add{ flex:0 0 86vw; scroll-snap-align:start; }
  .bay-add{ flex-basis:70vw; min-height:300px; }
  .demo-note{ margin:0 16px 18px; }
}

/* ---------- Car view ---------- */
.page{ padding:26px 24px; }
.page-head{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:20px; }
.page-head h1{ font-size:clamp(26px,4vw,40px); }
.page-head .sub{ color:var(--muted); width:100%; margin:-6px 0 0; }
.car-grid{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(260px,.75fr); gap:26px; align-items:start; }
.car-grid .wide{ grid-column:1 / -1; }
@media (max-width:860px){ .car-grid{ grid-template-columns:1fr; } }
.clip + .clip{ margin-top:34px; }
.clip{ background:var(--paper); border:3px solid var(--ink); border-radius:12px; box-shadow:6px 6px 0 var(--ink); padding:30px 22px 22px; position:relative; margin-top:14px; min-width:0; }
.clip::before{ content:""; position:absolute; top:-15px; left:50%; width:96px; height:26px; margin-left:-48px; background:linear-gradient(#D6DBE2,#9AA3AF); border:3px solid var(--ink); border-radius:8px 8px 4px 4px; }
.clip h2{ font-size:22px; margin-bottom:14px; }
.clip h3{ font-size:17px; margin:18px 0 8px; }
.passport-top{ display:grid; grid-template-columns:minmax(0,240px) 1fr; gap:22px; }
@media (max-width:560px){ .passport-top{ grid-template-columns:1fr; } }
.passport-top .polaroid{ width:100%; margin:0; transform:rotate(-1.5deg); }
.thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.thumbs img,.thumb{ width:62px; height:62px; object-fit:cover; border:2px solid var(--ink); border-radius:6px; cursor:zoom-in; }
.thumb-wrap{ position:relative; }
.thumb-wrap button{ position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; border:2px solid var(--ink); background:var(--red); color:#fff; font-weight:700; cursor:pointer; line-height:1; padding:0; }
dl.spec{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:15px; }
dl.spec dt{ color:var(--muted); }
dl.spec dd{ margin:0; font-weight:500; overflow-wrap:anywhere; }
.descr{ margin:14px 0 0; padding:10px 12px; background:var(--paper-2); border-radius:8px; border:2px dashed var(--ink); white-space:pre-wrap; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

.rack{ border-left:14px solid var(--metal); border-right:14px solid var(--metal); outline:3px solid var(--ink); background:rgba(0,0,0,.06); margin-top:14px; box-shadow:6px 6px 0 var(--ink); }
.rack-title{ font-family:"Russo One",sans-serif; text-align:center; padding:8px; background:var(--ink); color:#fff; font-size:15px; }
.shelf{ display:flex; align-items:flex-end; gap:14px; padding:12px 16px 12px; text-decoration:none; border-bottom:12px solid var(--wood); box-shadow:inset 0 -3px 0 var(--ink); transition:background .15s; }
.shelf:hover,.shelf.active{ background:rgba(255,255,255,.4); }
.shelf svg{ width:72px; height:50px; flex:none; transition:transform .2s; }
.shelf:hover svg{ transform:translateY(-5px) rotate(-3deg); }
.shelf .st{ display:flex; flex-direction:column; line-height:1.2; }
.shelf .st b{ font-family:"Russo One",sans-serif; font-weight:400; font-size:16px; }
.shelf .st small{ color:var(--muted); font-size:13px; }

/* ---------- Status list ---------- */
.status-list{ list-style:none; margin:0; padding:0; }
.status-list li{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:10px 0; border-bottom:2px dashed var(--paper-2); }
.status-list .nm{ font-weight:500; }
.status-list .meta{ grid-column:1 / -1; font-size:13px; color:var(--muted); }
.bar{ grid-column:1 / -1; height:10px; border:2px solid var(--ink); border-radius:6px; background:var(--paper-2); overflow:hidden; }
.bar i{ display:block; height:100%; }
.chip{ display:inline-block; font-size:12.5px; font-weight:600; padding:2px 9px; border:2px solid var(--ink); border-radius:20px; white-space:nowrap; color:#1F2433; }
.chip.red{ background:var(--red); color:#fff; } .chip.yellow{ background:var(--yellow); } .chip.green{ background:var(--green); color:#fff; }
.chip.grey{ background:#D5DAE1; } .chip.blue{ background:var(--blue); color:#fff; }

/* ---------- Records ---------- */
.toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:14px; }
.toolbar .sum{ margin-left:auto; font-weight:600; }
.recs{ list-style:none; margin:0; padding:0; }
.rec{ padding:14px 0; border-bottom:2px dashed var(--paper-2); display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:4px 16px; }
.rec:last-child{ border-bottom:0; }
.rec .when{ font-weight:600; }
.rec .when small{ display:block; color:var(--muted); font-weight:400; }
.rec .what b{ display:block; }
.rec .what p{ margin:2px 0 0; font-size:14px; color:var(--muted); white-space:pre-wrap; }
.rec .what ul{ margin:4px 0 0; padding-left:18px; font-size:14px; }
.rec .cost{ text-align:right; font-weight:700; white-space:nowrap; }
.rec .cost .actions{ justify-content:flex-end; margin-top:8px; gap:6px; }
@media (max-width:600px){ .rec{ grid-template-columns:1fr; } .rec .cost{ text-align:left; } .rec .cost .actions{ justify-content:flex-start; } }
.empty{ text-align:center; padding:26px 10px; color:var(--muted); }
.empty svg{ width:90px; margin:0 auto 8px; display:block; }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
table.t th{ text-align:left; font-weight:600; color:var(--muted); border-bottom:3px solid var(--ink); padding:6px 8px; }
table.t td{ padding:8px; border-bottom:2px dashed var(--paper-2); vertical-align:top; }
.tscroll{ overflow-x:auto; }
.tire-card{ border:3px solid var(--ink); border-radius:12px; padding:14px; background:var(--paper-2); display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; }
.tire-card + .tire-card{ margin-top:14px; }
.tire-card svg{ width:70px; }
.tire-card h3{ margin:0 0 4px; }
.tread{ display:flex; flex-wrap:wrap; gap:6px; font-size:13px; margin-top:6px; }
.tread span{ background:var(--paper); border:2px solid var(--ink); border-radius:6px; padding:1px 7px; }

/* ---------- Modal ---------- */
dialog{ border:4px solid var(--ink); border-radius:14px; padding:0; background:var(--paper); color:var(--text); width:min(760px,94vw); max-height:92vh; box-shadow:8px 8px 0 var(--ink); }
dialog::backdrop{ background:rgba(20,24,34,.55); }
dialog form{ display:flex; flex-direction:column; max-height:92vh; }
.m-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; background:var(--yellow); color:#1F2433; border-bottom:3px solid var(--ink); }
.m-head h2{ font-size:20px; }
.m-body{ padding:18px 20px; overflow:auto; display:flex; flex-direction:column; gap:14px; }
.m-foot{ display:flex; justify-content:flex-end; gap:10px; padding:12px 20px; border-top:3px solid var(--ink); background:var(--paper-2); }
fieldset{ border:2px solid var(--ink); border-radius:10px; padding:10px 14px 14px; margin:0; }
legend{ font-family:"Russo One",sans-serif; padding:0 6px; }
.work{ padding:8px 0; border-bottom:1px dashed var(--muted); }
.work:last-child{ border-bottom:0; }
.work-check{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; cursor:pointer; font-weight:500; }
.work-details{ display:none; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:8px 0 2px 30px; }
.work.on .work-details{ display:grid; }
@media (max-width:600px){ .work-details{ grid-template-columns:1fr 1fr; margin-left:0; } }
.row{ display:grid; gap:8px; align-items:center; margin-bottom:8px; }
.row.err{ grid-template-columns:110px minmax(0,1fr) 130px 130px 36px; }
.row.cust{ grid-template-columns:minmax(0,1fr) 120px 120px 36px; }
@media (max-width:600px){ .row.err,.row.cust{ grid-template-columns:1fr 1fr; } }
.hint{ font-size:13px; color:var(--muted); margin:0; }
.check{ display:flex; align-items:center; gap:8px; }

<script>
/* =================== Utilities =================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addMonths = (s, m) => { const d = parseISO(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return toISO(d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtDate = s => s ? s.split('-').reverse().join('.') : '—';
const grp = n => String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmtKm = n => (n == null || isNaN(n)) ? '—' : grp(n) + ' км';
const fmtMoney = n => grp(n) + ' ₽';
const num = v => (v === '' || v == null) ? 0 : (Number(String(v).replace(',', '.')) || 0);
const byDate = (a, b) => (a.date||'').localeCompare(b.date||'') || (a.mileage||0) - (b.mileage||0);
const INK = '#1F2433';

/* =================== Storage (IndexedDB, fallback to memory) =================== */
const DB_NAME = 'garage-logbook', STORE = 'kv';
let dbConn = null, memoryMode = false;
function openDB(){
  if (dbConn) return Promise.resolve(dbConn);
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => { dbConn = r.result; res(dbConn); };
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function loadState(){
  try {
    const db = await openDB();
    return await new Promise((res, rej) => {
      const g = db.transaction(STORE, 'readonly').objectStore(STORE).get('state');
      g.onsuccess = () => res(g.result || null); g.onerror = () => rej(g.error);
    });
  } catch (e) { memoryMode = true; return null; }
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (memoryMode) return;
    try {
      const db = await openDB();
      db.transaction(STORE, 'readwrite').objectStore(STORE).put(JSON.parse(JSON.stringify(state)), 'state');
    } catch (e) { memoryMode = true; toast('Браузер не дал сохранить данные. Изменения живут до закрытия вкладки, сделайте резервную копию в настройках.', 'warn'); }
  }, 150);
}
const prefGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };

/* =================== Domain =================== */

let state;
const carById = id => state.cars.find(c => c.id === id);
const carName = c => `${c.make} ${c.model}`;
const recordsOf = (carId, type) => state.records.filter(r => r.carId === carId && (!type || r.type === type));
const currentMileage = car => Math.max(num(car.mileage), ...recordsOf(car.id).map(r => num(r.mileage)), 0);

function avgKmPerDay(car){
  const recs = recordsOf(car.id).filter(r => r.mileage).sort(byDate);
  let a = null, b = { date: todayISO(), km: currentMileage(car) };
  if (car.purchaseDate) a = { date: car.purchaseDate, km: num(car.purchaseMileage) };
  else if (recs.length) a = { date: recs[0].date, km: recs[0].mileage };
  if (!a) return null;
  const d = diffDays(a.date, b.date);
  if (d < 30 || b.km <= a.km) return null;
  return (b.km - a.km) / d;
}
function lastDone(carId, itemId, asOf){
  return recordsOf(carId, 'maintenance').filter(r => (!asOf || r.date <= asOf) && (r.items||[]).some(i => i.itemId === itemId)).sort(byDate).pop() || null;
}
function itemStatus(car, item, asOf, mileageAt){
  if (!item.applicable) return { state:'na' };
  if (!num(item.km) && !num(item.months)) return { state:'none' };
  const last = lastDone(car.id, item.id, asOf);
  if (!last) return { state:'unknown' };
  const ref = asOf || todayISO();
  const cur = mileageAt ?? currentMileage(car);
  let fr = Infinity, kmLeft = null, daysLeft = null, dueKm = null, dueDate = null;
  if (num(item.km)) { dueKm = num(last.mileage) + num(item.km); kmLeft = dueKm - cur; fr = Math.min(fr, kmLeft / num(item.km)); }
  if (num(item.months)) { dueDate = addMonths(last.date, num(item.months)); daysLeft = diffDays(ref, dueDate); fr = Math.min(fr, daysLeft / Math.max(1, diffDays(last.date, dueDate))); }
  let forecast = null;
  if (kmLeft != null && kmLeft > 0 && !asOf) { const v = avgKmPerDay(car); if (v) forecast = addDays(ref, Math.round(kmLeft / v)); }
  if (dueDate && (!forecast || dueDate < forecast) && daysLeft >= 0) forecast = forecast && forecast < dueDate ? forecast : dueDate;
  const st = fr < 0 ? 'red' : fr < 0.2 ? 'yellow' : 'green';
  return { state:st, fr, kmLeft, daysLeft, dueKm, dueDate, last, forecast };
}
function statusText(s){
  if (s.state === 'na') return 'не применимо';
  if (s.state === 'none') return 'без интервала';
  if (s.state === 'unknown') return 'нет записей';
  const parts = [];
  if (s.state === 'red') {
    if (s.kmLeft != null && s.kmLeft < 0) parts.push(`просрочено на ${fmtKm(-s.kmLeft)}`);
    if (s.daysLeft != null && s.daysLeft < 0) parts.push(`${s.kmLeft != null && s.kmLeft < 0 ? 'и' : 'просрочено на'} ${-s.daysLeft} дн.`);
    return parts.join(' ');
  }
  if (s.kmLeft != null) parts.push(`через ${fmtKm(s.kmLeft)}`);
  if (s.daysLeft != null) parts.push(`${s.daysLeft} дн.`);
  return parts.join(' или ');
}
const stateChip = s => { const cls = { red:'red', yellow:'yellow', green:'green' }[s.state] || 'grey'; return `<span class="chip ${cls}">${esc(statusText(s))}</span>`; };
const rank = { red:3, yellow:2, green:1 };
function carToStatus(car){
  let worst = null;
  car.items.forEach(it => { const s = itemStatus(car, it); if (rank[s.state] && (!worst || rank[s.state] > rank[worst.s.state] || (rank[s.state] === rank[worst.s.state] && s.fr < worst.s.fr))) worst = { it, s }; });
  return worst;
}

/* ---- Tires ---- */
const seasonGroup = s => s && s.startsWith('winter') ? 'winter' : s;
function expectedSeason(iso){
  const md = iso.slice(5);
  return (md >= state.settings.toSummer && md < state.settings.toWinter) ? 'summer' : 'winter';
}
function nextSwap(iso){
  const y = Number(iso.slice(0,4));
  const cands = [`${y}-${state.settings.toSummer}`, `${y}-${state.settings.toWinter}`, `${y+1}-${state.settings.toSummer}`].filter(d => d > iso).sort();
  const d = cands[0]; return { date:d, to: d.slice(5) === state.settings.toSummer ? 'summer' : 'winter' };
}
function tireStatus(car){
  const mounted = state.tireSets.find(t => t.carId === car.id && t.mounted);
  const t = todayISO();
  if (!mounted) return { state:'unknown', text:'комплект на автомобиле не указан' };
  if (mounted.season === 'allseason') return { state:'green', text:'всесезонные шины', mounted };
  const exp = expectedSeason(t);
  if (seasonGroup(mounted.season) !== exp) return { state:'red', text:`пора ставить ${exp === 'winter' ? 'зимние' : 'летние'} шины`, mounted };
  const n = nextSwap(t); const days = diffDays(t, n.date);
  return { state: days <= 14 ? 'yellow' : 'green', text:`смена на ${n.to === 'winter' ? 'зимние' : 'летние'} через ${days} дн. (${fmtDate(n.date)})`, mounted };
}
function tireMileage(car){
  const res = {}; const ch = recordsOf(car.id, 'tire').filter(r => r.tireOn).sort(byDate);
  ch.forEach((r, i) => { const end = i < ch.length - 1 ? num(ch[i+1].mileage) : currentMileage(car); res[r.tireOn] = (res[r.tireOn] || 0) + Math.max(0, end - num(r.mileage)); });
  return res;
}
function syncMounted(carId){

/* ---- Errors ---- */
function errorHistory(carId){
  const map = {};
  recordsOf(carId, 'diagnostics').sort(byDate).forEach(r => (r.errors||[]).forEach((e, idx) => {
    const k = String(e.code||'').trim().toUpperCase(); if (!k) return;
    const m = map[k] || (map[k] = { code:k, first:r.date, count:0 });
    m.count++; m.last = r.date; m.status = e.status; m.desc = e.desc || m.desc; m.system = e.system || m.system; m.recId = r.id; m.idx = idx;
  }));
  const repairs = state.records.filter(r => r.carId === carId && (r.type === 'minor' || r.type === 'major') && r.linkedCodes);
  Object.values(map).forEach(m => { m.fixedBy = repairs.filter(r => r.linkedCodes.toUpperCase().split(/[\s,;]+/).includes(m.code)).sort(byDate).pop(); });
  return Object.values(map).sort((a,b) => b.last.localeCompare(a.last));
}

/* ---- Reminders ---- */
function collectReminders(){
  const out = []; const t = todayISO();
  state.cars.forEach(car => {
    car.items.forEach(it => { const s = itemStatus(car, it); if (s.state === 'red' || s.state === 'yellow') out.push({ car, level:s.state, text:`${it.name}: ${statusText(s)}`, href:`#/car/${car.id}/to` }); });
    const ts = tireStatus(car); if (ts.state === 'red' || ts.state === 'yellow') out.push({ car, level:ts.state, text:`Шины: ${ts.text}`, href:`#/car/${car.id}/tires` });
    errorHistory(car.id).filter(e => e.status === 'active').forEach(e => out.push({ car, level:'red', text:`Активная ошибка ${e.code}${e.desc ? ', ' + e.desc : ''}`, href:`#/car/${car.id}/diag` }));
    state.records.filter(r => r.carId === car.id && (r.type === 'minor' || r.type === 'major')).forEach(r => {
      if (num(r.warrantyMonths)) { const end = addMonths(r.date, num(r.warrantyMonths)); const d = diffDays(t, end); if (d >= 0 && d <= 30) out.push({ car, level:'yellow', text:`Гарантия на «${r.title || r.description}» закончится через ${d} дн.`, href:`#/car/${car.id}/${r.type}` }); }
      if (num(r.warrantyKm)) { const left = num(r.mileage) + num(r.warrantyKm) - currentMileage(car); if (left >= 0 && left <= 1000) out.push({ car, level:'yellow', text:`Гарантия на «${r.title || r.description}» закончится через ${fmtKm(left)}`, href:`#/car/${car.id}/${r.type}` }); }
    });
  });
  return out.sort((a,b) => rank[b.level] - rank[a.level]);
}

let markerX = null;
function moveMarker(){
  const m = $('#marker'), a = $('#stops .stop.active'); if (!a) return;
  const x = a.offsetLeft + a.offsetWidth / 2 - m.offsetWidth / 2 + $('#stops').offsetLeft;
  if (markerX !== null && Math.abs(x - markerX) > 2 && !reduceMotion()) {
    m.classList.toggle('flip', x < markerX); m.classList.add('driving');
    clearTimeout(moveMarker.t); moveMarker.t = setTimeout(() => m.classList.remove('driving'), 900);
  }
  m.style.transform = `translateX(${x}px)`; markerX = x;
  const sc = $('.road-scroll'); const target = a.offsetLeft + $('#stops').offsetLeft - sc.clientWidth / 2 + a.offsetWidth / 2;

/* =================== Toasts =================== */
function toast(text, kind, action){
  const el = document.createElement('div'); el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = `<span>${text}</span><button aria-label="Закрыть">×</button>`;
  el.querySelector('button').onclick = () => el.remove();
  if (action) { const b = document.createElement('a'); b.className = 'btn small'; b.textContent = action.label; b.href = action.href; b.onclick = () => el.remove(); el.querySelector('span').after(b); }
  $('#toasts').append(el); setTimeout(() => el.remove(), kind === 'warn' ? 12000 : 4000);
}

function compressImage(file, max = 1600, q = 0.82){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width*k), h = Math.round(img.height*k); const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg', q)); }; img.onerror = () => rej(new Error('img')); img.src = fr.result; };
    fr.onerror = () => rej(fr.error); fr.readAsDataURL(file);
  });
}
function thumbsEditor(key){
  const arr = modalCtx[key] || [];
  return arr.map((src, i) => `<span class="thumb-wrap"><img class="thumb" src="${src}" alt="Фото ${i+1}"><button type="button" data-action="remove-thumb" data-key="${key}" data-idx="${i}" aria-label="Убрать фото ${i+1}">×</button></span>`).join('');
}
function bindFileInput(name, key, max, limit){
  const inp = $(`#mbody input[name="${name}"]`); if (!inp) return;
  inp.addEventListener('change', async () => {
    const files = [...inp.files];
    for (const f of files) { if ((modalCtx[key]||[]).length >= limit) { toast(`Можно добавить не больше ${limit} фото.`, 'warn'); break; } try { modalCtx[key] = [...(modalCtx[key]||[]), await compressImage(f, max, max > 1200 ? 0.82 : 0.72)]; } catch (e) { toast('Не удалось прочитать файл. Выберите изображение JPG или PNG.', 'warn'); } }
    inp.value = ''; $(`#th_${key}`).innerHTML = thumbsEditor(key);
  });
}

      <label class="f">Гарантия, мес.<input type="number" min="0" name="warrantyMonths" value="${num(r.warrantyMonths) || ''}"></label><label class="f">Гарантия, км<input type="number" min="0" name="warrantyKm" value="${num(r.warrantyKm) || ''}"></label></div>

function editRecord(carId, type, id){
  const car = carById(carId); const r = id ? state.records.find(x => x.id === id) : null;
  const html = recordForm(car, type, r);
  if (html === null) { toast('Сначала добавьте комплект шин, потом записывайте смену.', 'warn'); return; }
  openModal(`${r ? 'Изменить' : 'Новая'} запись: ${TYPES[type]}`, html, (fd, form) => {
    const rec = r || { id:uid(), carId, type, createdAt:new Date().toISOString() };
    rec.date = fd.get('date'); rec.mileage = num(fd.get('mileage')); rec.place = (fd.get('place')||'').trim();
    rec.attachments = modalCtx.att.slice(0, 6); rec.updatedAt = new Date().toISOString(); delete rec.demo;
    if (type === 'maintenance') {
      rec.items = car.items.filter(it => fd.get('w_' + it.id)).map(it => ({ itemId:it.id, name:it.name, partBrand:(fd.get('wb_'+it.id)||'').trim(), partNumber:(fd.get('wn_'+it.id)||'').trim(), partCost:num(fd.get('wp_'+it.id)), laborCost:num(fd.get('wl_'+it.id)) }));
      const cn = fd.getAll('cn'), cp = fd.getAll('cp'), cl = fd.getAll('cl');
      cn.forEach((n, i) => { if (n.trim()) rec.items.push({ itemId:null, name:n.trim(), partBrand:'', partNumber:'', partCost:num(cp[i]), laborCost:num(cl[i]) }); });
      if (!rec.items.length) { toast('Отметьте хотя бы одну работу.', 'warn'); return false; }
      rec.description = (fd.get('description')||'').trim();
    } else if (type === 'diagnostics') {
      rec.method = fd.get('method'); rec.laborCost = num(fd.get('laborCost')); rec.partsCost = 0; rec.description = (fd.get('description')||'').trim();
      const c = fd.getAll('ec'), d = fd.getAll('ed'), s = fd.getAll('es'), t = fd.getAll('et');
      rec.errors = c.map((code, i) => ({ code:code.trim().toUpperCase(), desc:d[i].trim(), system:s[i], status:t[i] })).filter(e => e.code || e.desc);
    } else if (type === 'minor' || type === 'major') {
      ['title','description','partsDesc','comment'].forEach(k => rec[k] = (fd.get(k)||'').trim());
      rec.linkedCodes = (fd.get('linkedCodes')||'').trim().toUpperCase();
      ['partsCost','laborCost','warrantyMonths','warrantyKm'].forEach(k => rec[k] = num(fd.get(k)));
      if (type === 'major') { rec.unit = fd.get('unit'); rec.orderNo = (fd.get('orderNo')||'').trim(); rec.downFrom = fd.get('downFrom'); rec.downTo = fd.get('downTo'); }
      if (rec.comment) rec.description = rec.description ? rec.description + '\n' + rec.comment : rec.comment, rec.comment = '';
    } else if (type === 'tire') {
      rec.tireOn = fd.get('tireOn'); rec.tireOff = fd.get('tireOff'); rec.mountCost = num(fd.get('mountCost')); rec.storageCost = num(fd.get('storageCost'));
      rec.laborCost = rec.mountCost + rec.storageCost; rec.partsCost = 0; rec.balance = !!fd.get('balance'); rec.description = (fd.get('description')||'').trim();
      if (rec.tireOn === rec.tireOff) { toast('Установленный и снятый комплекты совпадают. Выберите разные.', 'warn'); return false; }
    }
    const prevMax = Math.max(0, ...recordsOf(carId).filter(x => x.id !== rec.id && x.date <= rec.date).map(x => num(x.mileage)));
    if (rec.mileage < prevMax) toast(`Пробег ${fmtKm(rec.mileage)} меньше, чем в более ранней записи (${fmtKm(prevMax)}). Запись сохранена, проверьте цифры.`, 'warn');
    if (!r) state.records.push(rec);
    if (type === 'tire') syncMounted(carId);
    commit(r ? 'Запись обновлена' : 'Запись добавлена');
  });
  bindFileInput('attach', 'att', 1000, 6);
}

/* =================== Report =================== */
function reportParams(){
  const f = $('#reportForm'); const fd = new FormData(f);
  return { car:carById(f.dataset.car), from:fd.get('from'), to:fd.get('to'), sections:fd.getAll('sec'), photos:!!fd.get('photos') };
}
function reportData(p){
  const all = recordsOf(p.car.id).sort(byDate);
  const inP = all.filter(r => r.date >= p.from && r.date <= p.to);
  const recs = inP.filter(r => p.sections.includes(r.type));
  const before = all.filter(r => r.date < p.from);
  let startKm = before.length ? Math.max(...before.map(r => num(r.mileage))) : (p.car.purchaseDate && p.car.purchaseDate >= p.from && p.car.purchaseDate <= p.to ? num(p.car.purchaseMileage) : (inP.length ? Math.min(...inP.map(r => num(r.mileage))) : null));
  let endKm = inP.length ? Math.max(...inP.map(r => num(r.mileage))) : startKm;
  if (p.to >= todayISO()) endKm = Math.max(endKm || 0, currentMileage(p.car));
  const driven = startKm != null && endKm != null ? Math.max(0, endKm - startKm) : 0;
  const byType = {}; Object.keys(TYPES).forEach(k => byType[k] = { n:0, parts:0, labor:0, total:0 });
  recs.forEach(r => { const c = costsOf(r); const b = byType[r.type]; b.n++; b.parts += c.parts; b.labor += c.labor; b.total += c.total; });
  const total = Object.values(byType).reduce((s, b) => s + b.total, 0);
  return { recs, startKm, endKm, driven, byType, total, parts:Object.values(byType).reduce((s,b)=>s+b.parts,0), labor:Object.values(byType).reduce((s,b)=>s+b.labor,0) };
}
function updateReportSummary(){
  const p = reportParams(); const el = $('#reportSummary'); if (!el) return;
  if (!p.from || !p.to || p.from > p.to) { el.textContent = 'Выберите корректный период: дата «с» не позже даты «по».'; return; }
  const d = reportData(p);
  el.innerHTML = `За ${fmtDate(p.from)}–${fmtDate(p.to)}: записей ${d.recs.length}, пройдено ${fmtKm(d.driven)}, расходы ${fmtMoney(d.total)}${d.driven ? `, ${(d.total / d.driven).toFixed(2).replace('.', ',')} ₽ на километр` : ''}.`;
}
function applyPreset(k){
  const f = $('#reportForm'); const t = new Date(); const y = t.getFullYear(), m = t.getMonth();
  let a, b = toISO(t);
  if (k === 'month') a = toISO(new Date(y, m, 1));
  else if (k === 'prevmonth') { a = toISO(new Date(y, m-1, 1)); b = toISO(new Date(y, m, 0)); }
  else if (k === 'quarter') a = toISO(new Date(y, Math.floor(m/3)*3, 1));
  else if (k === 'year') a = `${y}-01-01`;
  else if (k === 'prevyear') { a = `${y-1}-01-01`; b = `${y-1}-12-31`; }
  else { const car = carById(f.dataset.car); const ds = recordsOf(car.id).map(r => r.date).concat(car.purchaseDate ? [car.purchaseDate] : []).sort(); a = ds[0] || b; }
  f.from.value = a; f.to.value = b; updateReportSummary();
}
function generatePDF(){
  if (!window.pdfMake) { toast('Модуль PDF не загрузился. Нужен интернет при первом открытии сайта, обновите страницу.', 'warn'); return; }
  const p = reportParams();
  if (!p.from || !p.to || p.from > p.to) { toast('Проверьте даты периода.', 'warn'); return; }
  if (!p.sections.length) { toast('Отметьте хотя бы один раздел.', 'warn'); return; }
  const d = reportData(p); const car = p.car;
  const hdr = arr => arr.map(t => ({ text:t, style:'th' }));
  const table = (widths, head, rows) => ({ table:{ headerRows:1, widths, body:[hdr(head), ...(rows.length ? rows : [[{ text:'Нет записей', colSpan:head.length, color:'#777' }, ...Array(head.length-1).fill('')]])] }, layout:'lightHorizontalLines', margin:[0,0,0,6] });
  const content = [];
  const titleStack = [
    { text:'Бортовой журнал', style:'muted' },
    { text:`${carName(car)}, ${car.year}`, style:'h1' },
    { text:`Период: ${fmtDate(p.from)} – ${fmtDate(p.to)}`, margin:[0,6,0,0] },
    { text:`VIN: ${car.vin || '—'}` }, { text:`Госномер: ${car.plate || '—'}` },
    { text:`Двигатель: ${car.engine || '—'}` },
    { text:`Отчёт сформирован ${fmtDate(todayISO())}`, style:'muted', margin:[0,6,0,0] },
  ];
  content.push(car.photo ? { columns:[{ image:car.photo, width:190 }, { stack:titleStack, margin:[16,0,0,0] }] } : { stack:titleStack });
  content.push({ text:'Сводка', style:'h2' });
  content.push(table(['*','auto'], ['Показатель','Значение'], [
    ['Пробег на начало периода', fmtKm(d.startKm)], ['Пробег на конец периода', fmtKm(d.endKm)], ['Пройдено', fmtKm(d.driven)],
    ...Object.entries(TYPES).filter(([k]) => p.sections.includes(k)).map(([k,l]) => [`Записей: ${l}`, String(d.byType[k].n)]),
  ]));
  content.push({ text:'Расходы', style:'h2' });
  content.push(table(['*',70,70,80], ['Раздел','Запчасти','Работы','Итого'], [
    ...Object.entries(TYPES).filter(([k]) => p.sections.includes(k)).map(([k,l]) => [l, fmtMoney(d.byType[k].parts), fmtMoney(d.byType[k].labor), fmtMoney(d.byType[k].total)]),
    [{ text:'Всего', bold:true }, { text:fmtMoney(d.parts), bold:true }, { text:fmtMoney(d.labor), bold:true }, { text:fmtMoney(d.total), bold:true }],
  ]));
  if (d.driven) content.push({ text:`Стоимость 1 км пробега: ${(d.total / d.driven).toFixed(2).replace('.', ',')} ₽`, margin:[0,2,0,0] });
  const rowsOf = t => d.recs.filter(r => r.type === t);
  const sec = (t, title, widths, head, mapRow) => { if (!p.sections.includes(t)) return; content.push({ text:title, style:'h2' }); content.push(table(widths, head, rowsOf(t).map(mapRow))); };
  sec('maintenance', 'Техническое обслуживание', [55,60,'*',90,60], ['Дата','Пробег','Работы','Где','Сумма'], r => [fmtDate(r.date), fmtKm(r.mileage), (r.items||[]).map(i => `• ${i.name}${i.partBrand ? ', ' + i.partBrand : ''}${i.partNumber ? ' (' + i.partNumber + ')' : ''}`).join('\n') + (r.description ? '\n' + r.description : ''), r.place || '', fmtMoney(costsOf(r).total)]);
  sec('diagnostics', 'Диагностика', [55,60,'*',80,60], ['Дата','Пробег','Ошибки','Способ','Сумма'], r => [fmtDate(r.date), fmtKm(r.mileage), ((r.errors||[]).map(e => `${e.code} ${e.desc} (${ERR_STATUS[e.status]})`).join('\n') || 'Ошибок нет') + (r.description ? '\n' + r.description : ''), r.method || '', fmtMoney(costsOf(r).total)]);
  const rep = r => [fmtDate(r.date), fmtKm(r.mileage), `${r.title || ''}${r.unit ? ' [' + r.unit + ']' : ''}\n${r.description || ''}${r.partsDesc ? '\nЗапчасти: ' + r.partsDesc : ''}${r.downFrom ? `\nПростой: ${fmtDate(r.downFrom)} – ${fmtDate(r.downTo)}` : ''}`, r.place || '', fmtMoney(costsOf(r).total)];
  sec('minor', 'Мелкие ремонты', [55,60,'*',90,60], ['Дата','Пробег','Неисправность и работы','Исполнитель','Сумма'], rep);
  sec('major', 'Крупные ремонты', [55,60,'*',90,60], ['Дата','Пробег','Неисправность и работы','Исполнитель','Сумма'], rep);
  sec('tire', 'Смена шин', [55,60,'*',60], ['Дата','Пробег','Установлены / сняты','Сумма'], r => { const on = state.tireSets.find(t => t.id === r.tireOn), off = state.tireSets.find(t => t.id === r.tireOff); return [fmtDate(r.date), fmtKm(r.mileage), `${on ? `${on.brand} ${on.model} (${SEASONS[on.season]}, ${on.size})` : '—'}${off ? `\nСняты: ${off.brand} ${off.model}` : ''}`, fmtMoney(costsOf(r).total)]; });
  const errs = []; d.recs.filter(r => r.type === 'diagnostics').forEach(r => (r.errors||[]).forEach(e => errs.push([e.code, e.desc || '', e.system || '', ERR_STATUS[e.status], fmtDate(r.date)])));
  if (p.sections.includes('diagnostics')) { content.push({ text:'Ошибки за период', style:'h2' }); content.push(table([55,'*',80,70,55], ['Код','Описание','Система','Статус','Дата'], errs)); }
  if (p.sections.includes('maintenance')) {
    content.push({ text:`Состояние ТО на ${fmtDate(p.to)}`, style:'h2' });
    const asOf = p.to < todayISO() ? p.to : null;
    content.push(table(['*',95,95,95], ['Работа','Последняя замена','Следующая','Статус'], p.car.items.filter(i => i.group === 'mandatory' || num(i.km) || num(i.months)).map(it => { const s = itemStatus(car, it, asOf, asOf ? d.endKm : undefined); return [it.name, s.last ? `${fmtDate(s.last.date)}\n${fmtKm(s.last.mileage)}` : '—', s.last ? `${s.dueKm ? fmtKm(s.dueKm) : ''}${s.dueDate ? '\n' + fmtDate(s.dueDate) : ''}` : '—', { text:statusText(s), color: s.state === 'red' ? '#C0392B' : s.state === 'yellow' ? '#B7791F' : '#333' }]; })));
  }
  if (p.photos) {
    const imgs = []; d.recs.forEach(r => (r.attachments||[]).forEach(a => imgs.push({ a, cap:`${fmtDate(r.date)}, ${TYPES[r.type]}` })));
    if (imgs.length) {
      content.push({ text:'Фото и документы', style:'h2', pageBreak:'before' });
      for (let i = 0; i < imgs.length; i += 3) content.push({ columns:imgs.slice(i, i+3).map(x => ({ stack:[{ image:x.a, fit:[160,120] }, { text:x.cap, style:'muted', margin:[0,2,0,0] }] })), columnGap:12, margin:[0,0,0,12] });
    }
  }
  const dd = {
    pageSize:'A4', pageMargins:[40,40,40,50], info:{ title:`Бортовой журнал ${carName(car)}` },
    defaultStyle:{ font:'Roboto', fontSize:9, lineHeight:1.2 },
    footer:(cp, pc) => ({ columns:[{ text:`${carName(car)}, ${car.year}`, margin:[40,10,0,0] }, { text:`Страница ${cp} из ${pc}`, alignment:'right', margin:[0,10,40,0] }], fontSize:8, color:'#666' }),
    content,
    styles:{ h1:{ fontSize:20, bold:true }, h2:{ fontSize:13, bold:true, margin:[0,14,0,6] }, th:{ bold:true, fillColor:'#EEEEEE' }, muted:{ color:'#666', fontSize:8.5 } },
  };
  const safe = s => String(s).replace(/[^\p{L}\p{N}-]+/gu, '_');
  try { pdfMake.createPdf(dd).download(`Журнал_${safe(car.make)}_${safe(car.model)}_${fmtDate(p.from)}-${fmtDate(p.to)}.pdf`); toast('PDF-отчёт сформирован'); }
  catch (e) { console.error(e); toast('Не удалось собрать PDF. Попробуйте без миниатюр фото.', 'warn'); }
}

/* =================== Backup =================== */
function exportData(){
  state.settings.lastBackupAt = todayISO(); save();
  const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `garage-backup-${todayISO()}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  render(); toast('Копия сохранена в файл');
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch (err) { toast('Файл не читается. Выберите копию, сохранённую этим сайтом.', 'warn'); return; }
  if (!data || !Array.isArray(data.cars) || !Array.isArray(data.records)) { toast('В файле нет журналов гаража. Выберите другую копию.', 'warn'); return; }
  openModal('Загрузка копии', `<p>В файле: машин ${data.cars.length}, записей ${data.records.length}.</p>
    <label class="check"><input type="radio" name="mode" value="merge" checked> Объединить с текущими данными</label>
    <label class="check"><input type="radio" name="mode" value="replace"> Заменить всё текущее содержимое</label>`, fd => {
    if (fd.get('mode') === 'replace') { state = { ...seed(), ...data, settings:{ ...seed().settings, ...(data.settings||{}) } }; }
    else {
      const merge = (a, b) => { const m = new Map(a.map(x => [x.id, x])); b.forEach(x => { const cur = m.get(x.id); if (!cur || (x.updatedAt || '') >= (cur.updatedAt || '')) m.set(x.id, x); }); return [...m.values()]; };
      state.cars = merge(state.cars, data.cars); state.records = merge(state.records, data.records); state.tireSets = merge(state.tireSets, data.tireSets || []);
    }
    commit('Данные загружены');
  }, 'Загрузить');
});

/* =================== Actions =================== */
const actions = {
  'toggle-theme'(){ const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; prefSet('garage-theme', next); syncThemeBtn(); },
  'close-modal'(){ closeModal(); },
  'add-car'(){ editCar(null); },
  'edit-car'(d){ editCar(d.id); },
  'delete-car'(d){ const car = carById(d.id); openModal('Удалить автомобиль?', `<p>${esc(carName(car))} и все его записи (${recordsOf(car.id).length}) будут удалены без возможности восстановления. Сначала можно сохранить копию в настройках.</p>`, () => { state.cars = state.cars.filter(c => c.id !== car.id); state.records = state.records.filter(r => r.carId !== car.id); state.tireSets = state.tireSets.filter(t => t.carId !== car.id); location.hash = '#/'; commit('Автомобиль удалён'); }, 'Удалить'); },
  'update-mileage'(d){ const car = carById(d.id); openModal('Обновить пробег', `<label class="f">Текущий пробег ${esc(carName(car))}, км<input type="number" name="km" min="0" value="${currentMileage(car)}" required></label><p class="hint">Пробег из записей журнала учитывается автоматически, если он больше.</p>`, fd => { const km = num(fd.get('km')); if (km < currentMileage(car)) toast(`Пробег меньше, чем в журнале (${fmtKm(currentMileage(car))}). Показывается наибольшее значение.`, 'warn'); car.mileage = km; commit('Пробег обновлён'); }); },
  'regs'(d){ editRegs(d.id); },
  'add-reg'(){ $('#regRows').insertAdjacentHTML('beforeend', regRow({ id:'c_' + uid(), name:'', group:'additional', km:0, months:0, applicable:true })); $('#regRows tr:last-child input').focus(); },
  'remove-reg'(d, el){ el.closest('tr').remove(); },
  'add-record'(d){ editRecord(d.id, d.type); },
  'edit-record'(d){ const r = state.records.find(x => x.id === d.id); editRecord(r.carId, r.type, r.id); },
  'delete-record'(d){ const r = state.records.find(x => x.id === d.id); openModal('Удалить запись?', `<p>${TYPES[r.type]} от ${fmtDate(r.date)} на ${fmtKm(r.mileage)} будет удалена.</p>`, () => { state.records = state.records.filter(x => x.id !== r.id); if (r.type === 'tire') syncMounted(r.carId); commit('Запись удалена'); }, 'Удалить'); },
  'add-cust-row'(){ $('#custRows').insertAdjacentHTML('beforeend', custRow()); $('#custRows .row:last-child input').focus(); },
  'add-err-row'(){ $('#errRows').insertAdjacentHTML('beforeend', errRow({ status:'active' })); $('#errRows .row:last-child input').focus(); },
  'remove-row'(d, el){ el.closest('.row').remove(); },
  'remove-thumb'(d){ modalCtx[d.key].splice(Number(d.idx), 1); $(`#th_${d.key}`).innerHTML = thumbsEditor(d.key); },
  'resolve-error'(d){ const r = state.records.find(x => x.id === d.id); if (r && r.errors[d.idx]) { r.errors[d.idx].status = 'resolved'; r.updatedAt = new Date().toISOString(); commit('Ошибка отмечена устранённой'); } },
  'add-tireset'(d){ editTireSet(d.id); },
  'edit-tireset'(d){ const t = state.tireSets.find(x => x.id === d.id); editTireSet(t.carId, t.id); },
  'delete-tireset'(d){ const t = state.tireSets.find(x => x.id === d.id); openModal('Удалить комплект?', `<p>${esc(t.brand)} ${esc(t.model)} будет удалён. Записи смены шин останутся.</p>`, () => { state.tireSets = state.tireSets.filter(x => x.id !== t.id); commit('Комплект удалён'); }, 'Удалить'); },
  'add-tread'(d){ const t = state.tireSets.find(x => x.id === d.id); openModal('Замер протектора', `<div class="grid2"><label class="f">Дата<input type="date" name="date" value="${todayISO()}" required></label><label class="f">Глубина, мм<input type="number" step="0.1" min="0" max="20" name="mm" required></label></div><p class="hint">Минимум по закону: 1,6 мм для летних и 4 мм для зимних шин.</p>`, fd => { t.tread = [...(t.tread||[]), { date:fd.get('date'), mm:num(fd.get('mm')) }]; delete t.demo; commit('Замер сохранён'); }); },
  'report-preset'(d){ applyPreset(d.preset); },
  'report-generate'(){ generatePDF(); },
  'view-photo'(d){ const car = carById(d.id); const src = d.src === 'main' ? car.photo : car.photos[Number(d.src)]; if (src) { $('#viewerImg').src = src; $('#viewer').showModal(); } },
  'view-attach'(d){ const r = state.records.find(x => x.id === d.id); $('#viewerImg').src = r.attachments[Number(d.src)]; $('#viewer').showModal(); },
  'save-season'(){ const f = $('#seasonForm'); const s = f.summer.value.slice(5), w = f.winter.value.slice(5); if (!s || !w || s >= w) { toast('Дата смены на летние должна быть раньше даты смены на зимние.', 'warn'); return; } state.settings.toSummer = s; state.settings.toWinter = w; commit('Даты сохранены'); },
  'export'(){ exportData(); },
  'import'(){ $('#importFile').click(); },
  'remove-demo'(){ openModal('Удалить примеры?', '<p>Будут удалены демонстрационные записи и комплекты шин. Ваши собственные записи и карточки машин останутся.</p>', () => { state.records = state.records.filter(r => !r.demo); state.tireSets = state.tireSets.filter(t => !t.demo); commit('Примеры удалены'); }, 'Удалить примеры'); },
  'reset'(){ openModal('Стереть всё?', '<p>Все машины, записи и фото будут удалены, гараж вернётся к исходному виду с тремя машинами и примерами. Отменить нельзя.</p>', () => { state = seed(); location.hash = '#/'; commit('Гараж очищен'); }, 'Стереть'); },
  async 'notify-enable'(){ if (!('Notification' in window)) { toast('Этот браузер не поддерживает уведомления.', 'warn'); return; } const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Уведомления включены' : 'Уведомления не разрешены в браузере.'); if (p === 'granted') notifyOverdue(true); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const fn = actions[a.dataset.action]; if (!fn) return;
  e.preventDefault(); fn(a.dataset, a, e);
});
document.addEventListener('input', e => { if (e.target.closest('#reportForm')) updateReportSummary(); if (e.target.closest('#logForm')) renderLogList(); });
document.addEventListener('change', e => { if (e.target.closest('#reportForm')) updateReportSummary(); });

function syncThemeBtn(){ const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); $('#themeBtn').textContent = cur === 'dark' ? 'День' : 'Ночь'; $('#themeBtn').setAttribute('aria-label', cur === 'dark' ? 'Включить дневной гараж' : 'Включить ночной гараж'); }
function notifyOverdue(force){
  const reds = collectReminders().filter(x => x.level === 'red');
  if (!reds.length) return;
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Мой гараж', { body:`Просрочено: ${reds.length}. ${reds[0].car.model}: ${reds[0].text}` }); } catch (e) {}
}

/* =================== Start =================== */
(async function init(){
  const th = prefGet('garage-theme'); if (th) document.documentElement.dataset.theme = th; syncThemeBtn();
  state = await loadState() || seed();
  state.settings = { toWinter:'10-15', toSummer:'04-15', lastBackupAt:null, createdAt:todayISO(), ...(state.settings || {}) };
  state.tireSets = state.tireSets || [];
  save(); lastRoute = location.hash; render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const rem = collectReminders(); const reds = rem.filter(x => x.level === 'red').length, yel = rem.filter(x => x.level === 'yellow').length;
  if (reds || yel) toast(`Внимание: просрочено ${reds}, скоро подойдёт ${yel}.`, 'warn', { label:'Открыть', href:'#/reminders' });
  const lb = state.settings.lastBackupAt || state.settings.createdAt;
  if (lb && diffDays(lb, todayISO()) > 30) toast('Резервной копии больше 30 дней. Сохраните журналы в файл.', 'warn', { label:'Сохранить', href:'#/settings' });
  if (memoryMode) toast('Браузер не даёт хранить данные на этой странице. Скачайте файл и откройте его локально, чтобы журналы сохранялись.', 'warn');
  notifyOverdue();
})();
</script>
